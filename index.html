<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prism Arcade</title>
  <meta name="description" content="Prism Arcade — la plateforme de jeux de Studio Prism. Joue, progresse, débloque.">
  <meta name="theme-color" content="#0a0a16">
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Accueil Prism Arcade">
      <img src="assets/logo-mark.svg" alt="" width="38" height="38">
      <span class="brand-text">PRISM <b>ARCADE</b></span>
    </a>
    <nav class="nav">
      <a href="#/" data-nav="home">Jeux</a>
      <a href="#/classements" data-nav="classements">Classements</a>
      <a href="#/profil" data-nav="profil">Profil</a>
      <a href="#/boutique" data-nav="boutique">Boutique</a>
    </nav>
    <a class="player-chip" href="#/profil" id="player-chip" aria-label="Mon profil"></a>
    <div id="auth-slot"></div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="footer">
    <span>Prism Arcade · une branche Prism Game de <b>Studio Prism</b></span>
    <span class="muted">v<span id="ver"></span> · <span id="foot-sync">progression sauvegardée sur cet appareil</span></span>
  </footer>

  <!-- Écran de jeu -->
  <section id="game-layer" class="game-layer" hidden aria-modal="true" role="dialog">
    <div class="game-top">
      <button class="icon-btn" id="g-back" aria-label="Quitter le jeu">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="g-title" id="g-title"></div>
      <div class="g-scores">
        <div><small>Score</small><b id="g-score">0</b></div>
        <div><small>Record</small><b id="g-best">0</b></div>
      </div>
      <button class="icon-btn" id="g-mute" aria-label="Couper le son"></button>
      <button class="icon-btn" id="g-pause" aria-label="Pause">
        <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      </button>
    </div>
    <div class="stage" id="stage">
      <canvas id="game-canvas"></canvas>
      <div class="overlay" id="g-overlay"></div>
    </div>
  </section>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true"></div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/core.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/games/fusion.js"></script>
  <script src="js/games/prism-run.js"></script>
  <script src="js/games/stack.js"></script>
  <script src="js/games/brick-break.js"></script>
  <script src="js/games/snake-neon.js"></script>
  <script src="js/games/gem-match.js"></script>
  <script src="js/games/block-drop.js"></script>
  <script src="js/games/flap.js"></script>
  <script src="js/games/astro-blast.js"></script>
  <script src="js/games/memory-pulse.js"></script>
  <script src="js/games/sky-jump.js"></script>
  <script src="js/games/shard-hit.js"></script>
  <script src="js/games/color-sort.js"></script>
  <script src="js/games/tap-tiles.js"></script>
  <script src="js/app.js"></script>
  <script async src="js/prism-presence.js" data-app="prismarcade"></script>
</body>
</html>
